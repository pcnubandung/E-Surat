server {
    listen $PORT;
    root /app/dist;
    index index.html;

    # Serve static files, fallback ke index.html untuk SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset statis
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
